<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مِرساة – MERSA | شات ذكي</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }
  .container {
    width: 100%;
    max-width: 900px;
    height: 90vh;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  }
  header {
    padding: 18px 25px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: bold; }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #00c9ff, #92fe9d);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
  }
  .slogan { font-size: 0.8rem; color: #92fe9d; margin-top: 2px; }
  .settings { display: flex; gap: 8px; align-items: center; }
  .btn {
    padding: 8px 14px;
    background: linear-gradient(135deg, #00c9ff, #92fe9d);
    color: #0f2027;
    border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
    transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.danger { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); color: #fff; }

  #chat {
    flex: 1; overflow-y: auto; padding: 25px;
    display: flex; flex-direction: column; gap: 15px;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

  .msg {
    max-width: 80%; padding: 12px 16px; border-radius: 16px;
    line-height: 1.7; word-wrap: break-word; animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    align-self: flex-start;
    background: linear-gradient(135deg, #00c9ff, #0072ff);
    color: #fff; border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-end;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-bottom-left-radius: 4px;
  }
  .msg.bot pre {
    background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px;
    overflow-x: auto; margin: 8px 0; direction: ltr; text-align: left;
  }
  .msg.bot code { font-family: 'Courier New', monospace; font-size: 0.9rem; }
  .msg.bot p { margin: 6px 0; }
  .msg.bot ul, .msg.bot ol { margin: 6px 20px; }
  .msg.bot strong { color: #92fe9d; }

  .typing {
    align-self: flex-end; padding: 12px 18px;
    background: rgba(255,255,255,0.1); border-radius: 16px; display: flex; gap: 4px;
  }
  .typing span {
    width: 8px; height: 8px; background: #92fe9d; border-radius: 50%;
    animation: bounce 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-8px); opacity: 1; } }

  .input-area {
    padding: 18px; background: rgba(0,0,0,0.3);
    border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px;
  }
  #userInput {
    flex: 1; padding: 12px 16px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
    color: #fff; font-size: 1rem; outline: none; resize: none;
    min-height: 45px; max-height: 120px;
  }
  #userInput:focus { border-color: #92fe9d; }
  #sendBtn {
    padding: 0 22px; background: linear-gradient(135deg, #00c9ff, #92fe9d);
    color: #0f2027; border: none; border-radius: 12px; cursor: pointer;
    font-weight: bold; font-size: 1rem; transition: transform 0.2s;
  }
  #sendBtn:hover:not(:disabled) { transform: scale(1.05); }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .welcome { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.7); }
  .welcome h2 { color: #92fe9d; margin-bottom: 10px; font-size: 1.8rem; }
  .welcome p { font-size: 0.95rem; line-height: 1.8; }
  .error { background: rgba(255,107,107,0.2); border: 1px solid #ff6b6b; color: #ffb3b3; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">⚓</div>
      <div>
        <div>مِرساة – MERSA</div>
        <div class="slogan">لا تذاكر أكثر… ذاكر بذكاء</div>
      </div>
    </div>
    <div class="settings">
      <button class="btn danger" id="clearBtn">🗑️ مسح</button>
    </div>
  </header>

  <div id="chat">
    <div class="welcome">
      <h2>مرحباً بك في مِرساة ⚓</h2>
      <p>
        مساعدك الذكي للمذاكرة بذكاء وسرعة فائقة.<br>
        <strong>ابدأ بطرح سؤالك مباشرة 👇</strong>
      </p>
    </div>
  </div>

  <div class="input-area">
    <textarea id="userInput" placeholder="اكتب سؤالك هنا... (Shift+Enter لسطر جديد)" rows="1"></textarea>
    <button id="sendBtn">إرسال ➤</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');

// ⚙️ إعدادات OpenRouter API
// ⚠️ استبدل هذا بمفتاحك من https://openrouter.ai/keys (يبدأ بـ sk-or-)
const API_KEY = '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'; 

// ✅ النموذج المجاني والمضمون 100% على OpenRouter
const MODEL = 'meta-llama/llama-3.1-8b-instruct'; 

let history = [];

// تحميل المحادثة المحفوظة
const savedHistory = localStorage.getItem('mersa_history_or');
if (savedHistory) {
  try {
    history = JSON.parse(savedHistory);
    history.forEach(m => renderMessage(m.role === 'user' ? 'user' : 'bot', m.content));
  } catch(e) { history = []; }
}

clearBtn.addEventListener('click', () => {
  if (confirm('هل تريد مسح المحادثة بالكامل؟')) {
    history = [];
    localStorage.removeItem('mersa_history_or');
    chat.innerHTML = `<div class="welcome"><h2>مرحباً بك في مِرساة ⚓</h2><p>مساعدك الذكي للمذاكرة بذكاء.<br>ابدأ بطرح سؤالك 👇</p></div>`;
  }
});

function formatText(text) {
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => `<pre><code>${escapeHtml(code.trim())}</code></pre>`);
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  text = text.replace(/^\s*[-*]\s+(.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
  text = text.split(/\n\n+/).map(p => {
    if (p.startsWith('<pre>') || p.startsWith('<ul>') || p.startsWith('<ol>')) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  return text;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMessage(type, text) {
  const welcome = chat.querySelector('.welcome');
  if (welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = type === 'bot' ? formatText(text) : escapeHtml(text).replace(/\n/g, '<br>');
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  if (!API_KEY.startsWith('sk-or-')) {
    renderMessage('bot', '⚠️ **تنبيه:** يرجى فتح الكود واستبدال `API_KEY` بمفتاحك من OpenRouter (يبدأ بـ sk-or-). احصل عليه مجاناً من openrouter.ai/keys');
    chat.lastElementChild.classList.add('error');
    return;
  }

  renderMessage('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  showTyping();

  const systemPrompt = `أنت "مِرساة" (MERSA)، مساعد تعليمي ذكي للطلاب. شعارك: "لا تذاكر أكثر… ذاكر بذكاء". 
مهمتك: مساعدة الطلاب على المذاكرة بفعالية، تحليل نقاط الضعف، وضع خطط مذاكرة، وتقديم اختبارات مراجعة. 
تحدث بالعربية بشكل ودود ومحفز، واستخدم الإيموجي.`;

  try {
    // استخدام OpenRouter API (متوافق تماماً مع صيغة OpenAI)
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json',
        'HTTP-Referer': window.location.href, // مطلوب من OpenRouter
        'X-Title': 'MERSA Chat' // مطلوب من OpenRouter
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { role: 'system', content: systemPrompt },
          ...history
        ],
        temperature: 0.7,
        max_tokens: 2048
      })
    });

    const data = await res.json();
    removeTyping();

    if (!res.ok) {
      const errMsg = data.error?.message || 'حدث خطأ في الاتصال';
      renderMessage('bot', `❌ **خطأ:** ${errMsg}`);
      chat.lastElementChild.classList.add('error');
      history.pop();
    } else {
      const reply = data.choices[0].message.content;
      renderMessage('bot', reply);
      history.push({ role: 'assistant', content: reply });
      localStorage.setItem('mersa_history_or', JSON.stringify(history));
    }
  } catch (err) {
    removeTyping();
    renderMessage('bot', `❌ **خطأ في الشبكة:** ${err.message}`);
    chat.lastElementChild.classList.add('error');
    history.pop();
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
